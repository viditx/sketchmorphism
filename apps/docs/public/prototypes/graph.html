<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchmorphism Graph</title>
  <style>
    :root {
      --desk: #1a1a1a;
      --paper: #f4efd8;
      --paper-lift: #fbf7ec;
      --ink: #2b2b2b;
      --ink-soft: #4a4a4a;
      --red: #c2402a;
      --red-ghost: rgba(194,64,42,.45);
      --blue: #47658c;
      --blue-ghost: rgba(71,101,140,.4);
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--desk);
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      color: var(--ink);
      padding: 32px;
      box-sizing: border-box;
    }

    .container {
      background: var(--paper);
      padding: 48px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      max-width: 800px;
      width: 100%;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
    }

    /* Decorative Code Block */
    .code-block {
      background: rgba(0,0,0,0.05);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      box-sizing: border-box;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--ink-soft);
      overflow-x: auto;
      border: 2px dashed var(--blue-ghost);
    }
    .code-block b { color: var(--ink); }
    .code-block .tag { color: var(--blue); }
    .code-block .attr { color: var(--red); }

    .doodle-chart {
      position: absolute;
      top: -20px;
      left: -20px;
      width: 60px;
      height: 60px;
      stroke: var(--blue);
      stroke-width: 2.5;
      fill: none;
      transform: rotate(-10deg);
    }

    /* ── SKM GRAPH ───────────────────────────────────── */
    .skm-graph text{font-family:'Space Mono',monospace;letter-spacing:.08em}
    .ax{stroke:var(--blue);stroke-width:2;fill:none;stroke-linecap:round}
    .tk{stroke:var(--blue);stroke-width:1.8}
    .lb{fill:var(--blue);font-size:10px}
    .tt{fill:var(--ink);font-size:11px;font-weight:700}
    .gl{stroke:var(--blue);stroke-width:1;opacity:.16;fill:none}
    .ser{stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .pt{fill:var(--ink)}
    .halo{fill:var(--paper)}
    .rd{stroke:var(--red)}
    .rd-f{fill:var(--red)}
    .dash{stroke-dasharray:3 6;opacity:.8}
  </style>
</head>
<body>

  <div class="container">
    <svg class="doodle-chart" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M 20 80 L 80 80 M 20 80 L 20 20 M 30 70 L 50 40 L 70 30" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    
    <h1>Graph</h1>

    <!-- ── SKM GRAPH ───────────────────────────────────── -->
    <svg class="skm-graph" viewBox="0 0 560 340" role="img" aria-labelledby="skm-grp-t skm-grp-d"
         style="width:100%;max-width:720px;height:auto">
      <title id="skm-grp-t">Shipments, January to June</title>
      <desc id="skm-grp-d">Hand-drawn line chart rising from 32 in January to a peak of 84 in June.</desc>

      <defs>
        <filter id="skm-grp-w1" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.022 0.035" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
        </filter>
        <filter id="skm-grp-w2" x="-25%" y="-25%" width="150%" height="150%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03 0.045" numOctaves="3" seed="11" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="5.5"/>
        </filter>
        <pattern id="skm-grp-grid" x="70" y="40" width="45" height="48" patternUnits="userSpaceOnUse">
          <path class="gl" d="M45 0H0V48"/>
        </pattern>
        <clipPath id="skm-grp-plot"><rect x="70" y="40" width="450" height="240"/></clipPath>
      </defs>

      <!-- GRID -->
      <rect x="70" y="40" width="450" height="240" fill="url(#skm-grp-grid)"/>

      <!-- AXES · construction blue, overshooting -->
      <path class="ax" filter="url(#skm-grp-w1)" d="M 50 280.5 Q 285 279.2 538 280.3"/>
      <path class="ax" filter="url(#skm-grp-w1)" d="M 69.6 298 Q 70.5 165 69.5 28"/>
      <path class="tk" d="M70 280v7M160 280v7M250 280v7M340 280v7M430 280v7M520 280v7"/>
      <path class="tk" d="M70 280h-7M70 222h-7M70 164h-7M70 106h-7M70 48h-7"/>
      <text class="lb" x="70" y="300" text-anchor="middle">JAN</text>
      <text class="lb" x="160" y="300" text-anchor="middle">FEB</text>
      <text class="lb" x="250" y="300" text-anchor="middle">MAR</text>
      <text class="lb" x="340" y="300" text-anchor="middle">APR</text>
      <text class="lb" x="430" y="300" text-anchor="middle">MAY</text>
      <text class="lb" x="520" y="300" text-anchor="middle">JUN</text>
      <text class="lb" x="56" y="283" text-anchor="end">0</text>
      <text class="lb" x="56" y="225" text-anchor="end">25</text>
      <text class="lb" x="56" y="167" text-anchor="end">50</text>
      <text class="lb" x="56" y="109" text-anchor="end">75</text>
      <text class="lb" x="56" y="51" text-anchor="end">100</text>

      <!-- DATA · graphite series -->
      <path class="ax dash" d="M 520 85 V 280"/>
      <path class="ser" filter="url(#skm-grp-w1)"
            d="M 70 206 C 100 193 132 180 160 176 C 190 171 222 187 250 192 C 280 197 312 156 340 138 C 368 120 402 143 430 148 C 464 154 494 110 520 85"/>
      <circle class="halo" cx="70"  cy="206" r="5.5"/><circle class="pt" cx="70"  cy="206" r="4"/>
      <circle class="halo" cx="160" cy="176" r="5.5"/><circle class="pt" cx="160" cy="176" r="4"/>
      <circle class="halo" cx="250" cy="192" r="5.5"/><circle class="pt" cx="250" cy="192" r="4"/>
      <circle class="halo" cx="340" cy="138" r="5.5"/><circle class="pt" cx="340" cy="138" r="4"/>
      <circle class="halo" cx="430" cy="148" r="5.5"/><circle class="pt" cx="430" cy="148" r="4"/>
      <circle class="halo" cx="520" cy="85"  r="6"/>  <circle class="rd-f" cx="520" cy="85" r="4.4"/>

      <!-- ANNOTATION · one red moment -->
      <path class="rd" fill="none" stroke-width="2.4" stroke-linecap="round" filter="url(#skm-grp-w2)"
            d="M 501 84 C 500 73 517 67 527 71 C 539 75 542 85 534 91 C 525 98 505 96 502 88 C 500 85 501 82 504 79"/>
      <path class="rd" fill="none" stroke-width="2" stroke-linecap="round" d="M 497 74 Q 484 66 472 62"/>
      <text class="lb" x="468" y="60" text-anchor="end" style="fill:var(--red)">PEAK · 84</text>

      <!-- TITLE -->
      <text class="tt" x="70" y="20">SHIPMENTS — H1</text>
      <path class="rd" fill="none" stroke-width="2.5" stroke-linecap="round" filter="url(#skm-grp-w1)" d="M 70 27 Q 93 25.8 116 26.8"/>
    </svg>

    <div class="code-block">
      <pre><code><span class="tag">&lt;svg</span> <span class="attr">class</span>="skm-graph" <span class="attr">viewBox</span>="0 0 560 340"<span class="tag">&gt;</span>
  <span class="tag">&lt;!--</span> Uses SVG filters for the drawn look <span class="tag">--&gt;</span>
  <span class="tag">&lt;path</span> <span class="attr">class</span>="ser" <span class="attr">d</span>="..." <span class="attr">filter</span>="url(#skm-grp-w1)" <span class="tag">/&gt;</span>
<span class="tag">&lt;/svg&gt;</span></code></pre>
    </div>
  </div>

</body>
</html>
