<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="darkreader-lock">
  <title>Sketchmorphism Input</title>
  <style>
    :root {
      color-scheme: light;
      --desk: #d7cfbc;
      --paper: #f4efe3;
      --paper-lift: #fbf7ec;
      --ink: #2b2823;
      --ink-soft: #5d574d;
      --red: #c2402a;
      --red-ghost: rgba(194,64,42,.45);
      --blue: #47658c;
      --blue-ghost: rgba(71,101,140,.4);
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--desk);
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      color: var(--ink);
    }

    .container {
      background: var(--paper);
      padding: 48px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      max-width: 400px;
      width: 100%;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
    }

    /* Variable Controls */
    .controls {
      display: flex;
      gap: 24px;
      width: 100%;
      background: rgba(0,0,0,0.03);
      padding: 16px 20px;
      border-radius: 12px;
      box-sizing: border-box;
      border: 1px solid rgba(0,0,0,0.05);
      justify-content: center;
    }
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .ctrl-group input[type="text"] {
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: inherit;
      background: var(--paper-lift);
      color: var(--ink);
    }
    .ctrl-group input[type="color"] {
      border: 1px solid rgba(0,0,0,0.2);
      padding: 0;
      width: 100%;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      background: var(--paper-lift);
    }

    /* Decorative Code Block */
    .code-block {
      background: rgba(0,0,0,0.05);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      box-sizing: border-box;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--ink-soft);
      overflow-x: auto;
      border: 2px dashed var(--blue-ghost);
    }
    .code-block b { color: var(--ink); }
    .code-block .tag { color: var(--blue); }
    .code-block .attr { color: var(--red); }

    .doodle-spiral {
      position: absolute;
      bottom: -20px;
      left: -20px;
      width: 70px;
      height: 70px;
      stroke: var(--red);
      stroke-width: 2.5;
      fill: none;
      transform: rotate(-15deg);
    }

    /* ── SKM INPUT · INNOVATIVE ───────────────────────────────────── */
    .skm-field{width:100%; max-width: 280px;}
    .skm-field__label{display:block;margin-bottom:12px;
      font:600 14px/1.4 'Schibsted Grotesk',system-ui,sans-serif;color:var(--ink-soft);
      text-transform: uppercase; letter-spacing: 0.05em;}
    .skm-field__wrap{position:relative;}
    .skm-field__input{
      width:100%;background:none;border:0;padding:14px 16px;
      font:400 17px/1.4 'Schibsted Grotesk',system-ui,sans-serif;
      color:var(--ink);caret-color:var(--red);
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }
    .skm-field__input:focus{outline:none;}
    .skm-field__input::placeholder{color:rgba(43,40,35,.35)}
    
    .skm-field__art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0;}
    
    /* Base Box */
    .skm-inp-box {
      stroke: var(--ink-soft);
      stroke-width: 1.5;
      fill: var(--paper-lift);
      transition: fill 0.3s ease;
    }
    
    /* Focus Box (Animated Drawing) */
    .skm-inp-focus {
      stroke: var(--blue);
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.2, 1, 0.3, 1);
    }
    
    .skm-field__wrap:focus-within .skm-inp-focus {
      stroke-dashoffset: 0;
    }
    .skm-field__wrap:focus-within .skm-inp-box {
      fill: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <svg class="doodle-spiral" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M 50 50 m 0 -40 a 40 40 0 1 1 -39 40 a 30 30 0 1 1 59 -10 a 20 20 0 1 1 -39 5 a 10 10 0 1 1 18 0" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    
    <h1>Innovative Input</h1>

    <!-- ── SKM INPUT ───────────────────────────────────── -->
    <div class="skm-field">
      <label class="skm-field__label" for="skm-name">Secret Code</label>
      <div class="skm-field__wrap">
        <input class="skm-field__input" id="skm-name" type="text" placeholder="Enter code..." autocomplete="off">
        <svg class="skm-field__art" viewBox="0 0 280 50" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <filter id="skm-inp-w1" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.04 0.05" numOctaves="3" seed="4" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
            </filter>
          </defs>
          <!-- Base background box -->
          <path class="skm-inp-box" d="M 2 4 Q 140 1 278 3 Q 279 25 277 46 Q 140 49 3 47 Q 1 25 2 4 Z" filter="url(#skm-inp-w1)"/>
          <!-- Animated focus outline -->
          <path class="skm-inp-focus" pathLength="1" d="M 4 2 Q 140 4 276 3 Q 278 25 276 48 Q 140 46 4 47 Q 2 25 4 2 Z" filter="url(#skm-inp-w1)"/>
        </svg>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <label for="inp-focus">Focus Color</label>
        <input type="color" id="inp-focus" value="#47658c">
      </div>
      <div class="ctrl-group">
        <label for="inp-label">Label Text</label>
        <input type="text" id="inp-label" value="Secret Code">
      </div>
      <div class="ctrl-group">
        <label for="comp-size">Size</label>
        <input type="range" id="comp-size" min="0.5" max="2" step="0.1" value="1" style="cursor: pointer; accent-color: var(--blue);">
      </div>
    </div>

    <div class="code-block">
      <pre><code><span class="tag">&lt;div</span> <span class="attr">class</span>="skm-field"<span class="tag">&gt;</span>
  <span class="tag">&lt;label</span><span class="tag">&gt;</span>Secret Code<span class="tag">&lt;/label&gt;</span>
  <span class="tag">&lt;div</span> <span class="attr">class</span>="skm-field__wrap"<span class="tag">&gt;</span>
    <span class="tag">&lt;input</span> <span class="attr">type</span>="text"<span class="tag">&gt;</span>
    <span class="tag">&lt;svg</span> <span class="attr">class</span>="skm-field__art"<span class="tag">&gt;</span>...<span class="tag">&lt;/svg&gt;</span>
  <span class="tag">&lt;/div&gt;</span>
<span class="tag">&lt;/div&gt;</span></code></pre>
    </div>
  </div>

  <script>
    const focusEl = document.querySelector('.skm-inp-focus');
    const labelEl = document.querySelector('.skm-field__label');
    
    document.getElementById('inp-focus').addEventListener('input', (e) => {
      focusEl.style.setProperty('stroke', e.target.value);
    });
    
    document.getElementById('inp-label').addEventListener('input', (e) => {
      labelEl.textContent = e.target.value || '\u00A0';
    });
    
    document.getElementById('comp-size').addEventListener('input', (e) => {
      document.querySelector('.skm-field').style.transform = `scale(${e.target.value})`;
    });
  </script>

</body>
</html>
