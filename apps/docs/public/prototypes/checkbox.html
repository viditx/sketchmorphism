<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchmorphism Checkbox</title>
  <style>
    :root {
      --desk: #1a1a1a;
      --paper: #f4efd8;
      --paper-lift: #fbf7ec;
      --ink: #2b2b2b;
      --ink-soft: #4a4a4a;
      --red: #c2402a;
      --red-ghost: rgba(194,64,42,.45);
      --blue: #47658c;
      --blue-ghost: rgba(71,101,140,.4);
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--desk);
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      color: var(--ink);
    }

    .container {
      background: var(--paper);
      padding: 48px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      max-width: 400px;
      width: 100%;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
    }

    /* Decorative Code Block */
    .code-block {
      background: rgba(0,0,0,0.05);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      box-sizing: border-box;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--ink-soft);
      overflow-x: auto;
      border: 2px dashed var(--blue-ghost);
    }
    .code-block b { color: var(--ink); }
    .code-block .tag { color: var(--blue); }
    .code-block .attr { color: var(--red); }

    .doodle-tick {
      position: absolute;
      top: -20px;
      right: -20px;
      width: 50px;
      height: 50px;
      stroke: var(--blue);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: rotate(-10deg);
    }

    /* ── SKM CHECKBOX ───────────────────────────────────── */
    .skm-check{display:inline-flex;align-items:center;gap:12px;cursor:pointer;
      font:500 16px/1.4 'Schibsted Grotesk',system-ui,sans-serif;color:var(--ink);}
    .skm-check__input{position:absolute;opacity:0;width:1px;height:1px}
    .skm-check__art{width:32px;height:32px;flex:none;overflow:visible}
    .skm-check__tick{stroke-dasharray:1;transition:stroke-dashoffset .45s cubic-bezier(.27,1.36,.39,1) .05s}
    .skm-check__input:not(:checked) ~ .skm-check__art .skm-check__tick{stroke-dashoffset:1}
    .skm-check__input:checked ~ .skm-check__art .skm-check__tick{stroke-dashoffset:0}
    .skm-check__input:focus-visible ~ .skm-check__art{outline:2px dashed var(--blue);outline-offset:3px;border-radius:6px}
  </style>
</head>
<body>

  <div class="container">
    <svg class="doodle-tick" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M 20 50 L 40 70 L 90 20"/>
    </svg>
    
    <h1>Checkbox</h1>

    <!-- ── SKM CHECKBOX ───────────────────────────────────── -->
    <label class="skm-check">
      <input class="skm-check__input" type="checkbox" checked>
      <svg class="skm-check__art" viewBox="-4 -4 34 34" aria-hidden="true">
        <defs>
          <filter id="skm-chk-w1" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.022 0.035" numOctaves="3" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
          </filter>
        </defs>
        <path d="M 9.2 1.1 Q 13 .5 16.9 .9 Q 25.2 .6 25 9.1 Q 24.7 13 25.1 16.9 Q 25.3 25.2 16.8 25 Q 13 25.4 9.1 24.9 Q .8 25.3 1 16.9 Q .6 13 1.1 9.2 Q .7 .8 9.2 1.1 Z"
              style="fill:var(--paper-lift);stroke:var(--ink);stroke-width:2.2"
              stroke-linejoin="round" filter="url(#skm-chk-w1)"/>
        <path class="skm-check__tick" pathLength="1" d="M 6.2 14.1 L 10.9 18.8 L 20.3 7.4"
              fill="none" style="stroke:var(--red);stroke-width:3.2"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#skm-chk-w1)"/>
      </svg>
      <span class="skm-check__label">Accept the spec terms</span>
    </label>

    <div class="code-block">
      <pre><code><span class="tag">&lt;label</span> <span class="attr">class</span>="skm-check"<span class="tag">&gt;</span>
  <span class="tag">&lt;input</span> <span class="attr">type</span>="checkbox" <span class="attr">checked</span><span class="tag">&gt;</span>
  <span class="tag">&lt;svg</span> <span class="attr">class</span>="skm-check__art"<span class="tag">&gt;</span>...<span class="tag">&lt;/svg&gt;</span>
  <span class="tag">&lt;span</span><span class="tag">&gt;</span>Accept the spec terms<span class="tag">&lt;/span&gt;</span>
<span class="tag">&lt;/label&gt;</span></code></pre>
    </div>
  </div>

</body>
</html>
