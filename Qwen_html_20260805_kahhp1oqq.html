<!-- ── SKM INPUT · 260 wide ───────────────────────────────────── -->
<div class="skm-field">
  <label class="skm-field__label" for="skm-name">Your name</label>
  <div class="skm-field__wrap">
    <input class="skm-field__input" id="skm-name" type="text" placeholder="Ada Lovelace" autocomplete="name">
    <svg class="skm-field__art" viewBox="-6 0 272 14" aria-hidden="true">
      <defs>
        <filter id="skm-inp-w1" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.022 0.035" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
        </filter>
      </defs>
      <path d="M -4 3.2 Q 40 2.1 90 3.4 Q 140 2.3 190 3.2 Q 230 2.4 264 3.1"
            fill="none" style="stroke:var(--ink,#2b2823);stroke-width:2.2"
            stroke-linecap="round" filter="url(#skm-inp-w1)"/>
      <path class="skm-field__focus" pathLength="1" d="M -2 9.5 Q 60 8.4 130 9.6 Q 200 8.5 262 9.3"
            fill="none" style="stroke:var(--blue,#47658c);stroke-width:1.8"
            stroke-linecap="round" filter="url(#skm-inp-w1)"/>
    </svg>
  </div>
</div>

<style>
  .skm-field{width:260px}
  .skm-field__label{display:block;margin-bottom:8px;
    font:400 15px/1.4 'Shantell Sans',cursive;color:var(--ink-soft,#5d574d)}
  .skm-field__wrap{position:relative}
  .skm-field__input{width:100%;background:none;border:0;padding:.45em .2em;
    font:400 17px/1.4 'Schibsted Grotesk',system-ui,sans-serif;
    color:var(--ink,#2b2823);caret-color:var(--red,#c2402a)}
  .skm-field__input::placeholder{color:rgba(43,40,35,.35)}
  .skm-field__art{position:absolute;left:0;right:0;bottom:-4px;width:100%;height:14px;overflow:visible;pointer-events:none}
  .skm-field__focus{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s cubic-bezier(.27,1.36,.39,1)}
  .skm-field__wrap:focus-within .skm-field__focus{stroke-dashoffset:0}
</style>
