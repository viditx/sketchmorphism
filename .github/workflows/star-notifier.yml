name: GitHub Star Telegram Notifier

on:
  watch:
    types: [started]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Alert
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Secrets not configured yet. Skipping alert."
            exit 0
          fi
          
          REPO_DATA=$(curl -s "https://api.github.com/repos/${{ github.repository }}")
          STARS=$(echo "$REPO_DATA" | jq '.stargazers_count')
          USER="${{ github.actor }}"
          
          MESSAGE="⭐ <b>New Star on Sketchmorphism!</b>%0A%0A👤 <b>Starred by:</b> ${USER}%0A📊 <b>Total Stars:</b> ${STARS}%0A🔗 <a href='https://github.com/${{ github.repository }}'>View Repository</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"
